<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - LexorA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
    }
    
    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: 40px;
      border-radius: 20px;
      background: rgba(20, 20, 35, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .auth-header .logo-icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: inline-block;
      background: linear-gradient(135deg, #00f5ff, #00a8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .auth-header h2 {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    
    .auth-header p {
      font-size: 14px;
      color: #8888aa;
      margin: 0;
    }
    
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 24px;
      border-radius: 12px;
      background: #ffffff;
      color: #1a1a2e;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      margin-bottom: 24px;
    }
    
    .btn-google:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
    }
    
    .btn-github {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 24px;
      border-radius: 12px;
      background: #24292e;
      color: white;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      margin-bottom: 16px;
      text-decoration: none;
    }
    
    .btn-github:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(36, 41, 46, 0.4);
    }
    
    .auth-divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: #666688;
      font-size: 13px;
    }
    
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }
    
    .auth-divider span {
      padding: 0 16px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #aaaacc;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      font-size: 15px;
      transition: all 0.3s ease;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #00f5ff;
      background: rgba(0, 245, 255, 0.05);
      box-shadow: 0 0 0 3px rgba(0, 245, 255, 0.1);
    }
    
    .form-group input::placeholder {
      color: #666688;
    }
    
    .password-wrapper {
      position: relative;
    }
    
    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #8888aa;
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
    }
    
    .password-toggle:hover {
      color: #00f5ff;
    }
    
    .password-strength {
      margin-top: 8px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      font-size: 12px;
    }
    
    .password-strength.weak {
      border: 1px solid #ff4444;
      color: #ff4444;
    }
    
    .password-strength.medium {
      border: 1px solid #ffaa00;
      color: #ffaa00;
    }
    
    .password-strength.strong {
      border: 1px solid #00ff88;
      color: #00ff88;
    }
    
    .password-strength ul {
      margin: 0;
      padding-left: 20px;
      list-style: none;
    }
    
    .password-strength li {
      margin: 4px 0;
    }
    
    .password-strength li.valid {
      color: #00ff88;
    }
    
    .password-strength li.invalid {
      color: #ff4444;
    }
    
    .btn-primary {
      width: 100%;
      padding: 14px 24px;
      border-radius: 12px;
      background: linear-gradient(135deg, #00f5ff, #00a8ff);
      color: #0a0a0f;
      font-weight: 700;
      font-size: 16px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 245, 255, 0.3);
    }
    
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .auth-switch {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #8888aa;
    }
    
    .auth-switch a {
      color: #00f5ff;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }
    
    .auth-switch a:hover {
      color: #00a8ff;
    }
    
    .error-message,
    .success-message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    
    .error-message {
      background: rgba(255, 68, 68, 0.1);
      border: 1px solid rgba(255, 68, 68, 0.3);
      color: #ff4444;
    }
    
    .success-message {
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid rgba(0, 255, 136, 0.3);
      color: #00ff88;
    }
    
    @media (max-width: 480px) {
      .auth-card {
        padding: 24px 20px;
      }
      
      .auth-header h2 {
        font-size: 24px;
      }
      
      .auth-header .logo-icon {
        font-size: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card glass">
      <div class="auth-header">
        <div class="logo-icon large">◈</div>
        <h2>Create Account</h2>
        <p>Join LexorA AI Market Predictor</p>
      </div>
      
      <div class="error-message" id="error-message"></div>
      <div class="success-message" id="success-message"></div>
      
      <!-- Google OAuth - Primary Registration -->
      <a href="#" id="google-login-btn" class="btn-google">
        <svg width="20" height="20" viewBox="0 0 18 18">
          <path d="M17.64 9.2c0-.637-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.715H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.159 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Sign up with Google
      </a>
      
      <a href="#" id="github-login-btn" class="btn-github">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
        </svg>
        Sign up with GitHub
      </a>
      
      <div class="auth-divider">
        <span>or continue with email</span>
      </div>
      
      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required placeholder="Enter username" minlength="3" maxlength="30">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@email.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" required placeholder="Min 8 characters" minlength="8">
            <button type="button" class="password-toggle" id="toggle-password">👁️</button>
          </div>
          <div class="password-strength" id="password-strength">
            <ul>
              <li id="req-length">At least 8 characters</li>
              <li id="req-upper">At least one uppercase letter</li>
              <li id="req-lower">At least one lowercase letter</li>
              <li id="req-digit">At least one digit</li>
            </ul>
          </div>
        </div>
        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <div class="password-wrapper">
            <input type="password" id="confirm_password" name="confirm_password" required placeholder="Re-enter password">
            <button type="button" class="password-toggle" id="toggle-confirm-password">👁️</button>
          </div>
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">Create Account</button>
      </form>
      
      <p class="auth-switch">
        Already have an account? <a href="/login">Login</a>
      </p>
      
      <p class="auth-switch">
        <a href="/">← Back to Home</a>
      </p>
    </div>
  </div>

  <script src="{{ url_for('static', filename='config.js') }}"></script>
  
  <script>
    // Use centralized configuration
    window.API_BASE_URL = window.LEXORA_CONFIG ? window.LEXORA_CONFIG.API_BASE_URL : '';
    
    // Password strength checker
    function checkPasswordStrength(password) {
      const hasLength = password.length >= 8;
      const hasUpper = /[A-Z]/.test(password);
      const hasLower = /[a-z]/.test(password);
      const hasDigit = /[0-9]/.test(password);
      
      const strengthEl = document.getElementById('password-strength');
      const reqLength = document.getElementById('req-length');
      const reqUpper = document.getElementById('req-upper');
      const reqLower = document.getElementById('req-lower');
      const reqDigit = document.getElementById('req-digit');
      
      reqLength.className = hasLength ? 'valid' : 'invalid';
      reqUpper.className = hasUpper ? 'valid' : 'invalid';
      reqLower.className = hasLower ? 'valid' : 'invalid';
      reqDigit.className = hasDigit ? 'valid' : 'invalid';
      
      const validCount = [hasLength, hasUpper, hasLower, hasDigit].filter(Boolean).length;
      
      strengthEl.className = 'password-strength';
      if (validCount === 4) {
        strengthEl.classList.add('strong');
      } else if (validCount >= 2) {
        strengthEl.classList.add('medium');
      } else {
        strengthEl.classList.add('weak');
      }
      
      return validCount === 4;
    }
    
    // Password toggle
    document.getElementById('toggle-password').addEventListener('click', () => {
      const passwordInput = document.getElementById('password');
      passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
      document.getElementById('toggle-password').textContent = passwordInput.type === 'password' ? '👁️' : '🙈';
    });
    
    document.getElementById('toggle-confirm-password').addEventListener('click', () => {
      const passwordInput = document.getElementById('confirm_password');
      passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
      document.getElementById('toggle-confirm-password').textContent = passwordInput.type === 'password' ? '👁️' : '🙈';
    });
    
    // Password strength on input
    document.getElementById('password').addEventListener('input', (e) => {
      checkPasswordStrength(e.target.value);
    });
    
    // Google OAuth registration
    document.getElementById('google-login-btn').addEventListener('click', (e) => {
      e.preventDefault();
      window.location.href = '/auth/google';
    });
    
    // GitHub OAuth registration
    document.getElementById('github-login-btn').addEventListener('click', (e) => {
      e.preventDefault();
      window.location.href = '/auth/github';
    });

    // Email registration
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirm_password = document.getElementById('confirm_password').value;
      
      const errorEl = document.getElementById('error-message');
      const successEl = document.getElementById('success-message');
      const submitBtn = document.getElementById('submit-btn');
      
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      
      if (password !== confirm_password) {
        errorEl.textContent = 'Passwords do not match';
        errorEl.style.display = 'block';
        return;
      }
      
      if (!checkPasswordStrength(password)) {
        errorEl.textContent = 'Password does not meet strength requirements';
        errorEl.style.display = 'block';
        return;
      }
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account...';
      
      const formData = new FormData();
      formData.append('username', username);
      formData.append('email', email);
      formData.append('password', password);
      formData.append('confirm_password', confirm_password);
      
      try {
        const response = await fetch(`${window.API_BASE_URL}/auth/register`, {
          method: 'POST',
          body: formData,
          credentials: 'include'
        });
        const data = await response.json();
        
        if (data.success) {
          successEl.textContent = data.message;
          successEl.style.display = 'block';
          setTimeout(() => {
            window.location.href = data.redirect || '/login';
          }, 2000);
        } else {
          errorEl.textContent = data.error;
          errorEl.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }
      } catch (error) {
        console.error('Registration error:', error);
        errorEl.textContent = 'Registration failed. Please try again.';
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
