<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
    .pass { background: #d4edda; }
    .fail { background: #f8d7da; }
  </style>
</head>
<body>
  <h1>JavaScript Execution Test</h1>
  <div id="results"></div>
  
  <script>
    const results = document.getElementById('results');
    
    function addTest(name, passed, message) {
      const div = document.createElement('div');
      div.className = 'test ' + (passed ? 'pass' : 'fail');
      div.textContent = (passed ? '✓' : '✗') + ' ' + name + ': ' + message;
      results.appendChild(div);
    }
    
    // Test 1: Inline script execution
    addTest('Inline Script', true, 'This script is executing');
    
    // Test 2: DOM manipulation
    try {
      document.body.style.backgroundColor = '#f0f0f0';
      addTest('DOM Manipulation', true, 'Can modify DOM');
    } catch (e) {
      addTest('DOM Manipulation', false, e.message);
    }
    
    // Test 3: LocalStorage
    try {
      localStorage.setItem('test', 'value');
      localStorage.removeItem('test');
      addTest('LocalStorage', true, 'Can read/write localStorage');
    } catch (e) {
      addTest('LocalStorage', false, e.message);
    }
    
    // Test 4: Console
    console.log('Console test - check browser console');
    addTest('Console', true, 'Check browser console for message');
    
    // Test 5: External script loading
    const script = document.createElement('script');
    script.src = 'static/config.js';
    script.onload = function() {
      addTest('External Script (config.js)', true, 'Loaded successfully');
      if (typeof CONFIG !== 'undefined') {
        addTest('CONFIG Object', true, 'CONFIG is available');
      } else {
        addTest('CONFIG Object', false, 'CONFIG is not defined');
      }
    };
    script.onerror = function() {
      addTest('External Script (config.js)', false, 'Failed to load');
    };
    document.head.appendChild(script);
    
    // Test 6: DOMContentLoaded
    document.addEventListener('DOMContentLoaded', function() {
      addTest('DOMContentLoaded', true, 'Event fired');
    });
    
    console.log('=== JS TEST PAGE LOADED ===');
  </script>
</body>
</html>
