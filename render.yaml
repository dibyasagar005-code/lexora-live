services:
  - type: web
    name: lexora-live
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: APP_URL
        value: https://lexora-live.onrender.com
      - key: FLASK_ENV
        value: production
