<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LexorA</title>
  <link rel="stylesheet" href="static/style.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
    }
    
    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      border-radius: 20px;
      background: rgba(20, 20, 35, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    
    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .auth-header .logo-icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: inline-block;
      background: linear-gradient(135deg, #00f5ff, #00a8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .auth-header h2 {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    
    .auth-header p {
      font-size: 14px;
      color: #8888aa;
      margin: 0;
    }
    
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 24px;
      border-radius: 12px;
      background: #ffffff;
      color: #1a1a2e;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      margin-bottom: 24px;
    }
    
    .btn-google:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
    }
    
    .auth-divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: #666688;
      font-size: 13px;
    }
    
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }
    
    .auth-divider span {
      padding: 0 16px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #aaaacc;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: #ffffff;
      font-size: 15px;
      transition: all 0.3s ease;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #00f5ff;
      background: rgba(0, 245, 255, 0.05);
      box-shadow: 0 0 0 3px rgba(0, 245, 255, 0.1);
    }
    
    .form-group input::placeholder {
      color: #666688;
    }
    
    .password-wrapper {
      position: relative;
    }
    
    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #8888aa;
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
    }
    
    .password-toggle:hover {
      color: #00f5ff;
    }
    
    .checkbox-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #aaaacc;
      cursor: pointer;
      text-transform: none;
      letter-spacing: normal;
    }
    
    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
      accent-color: #00f5ff;
    }
    
    .checkbox-group a {
      color: #00f5ff;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s ease;
    }
    
    .checkbox-group a:hover {
      color: #00a8ff;
    }
    
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 24px;
      border-radius: 12px;
      background: white;
      color: #333;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      margin-bottom: 16px;
      text-decoration: none;
    }
    
    .btn-google:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
    }
    
    .btn-github {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 24px;
      border-radius: 12px;
      background: #24292e;
      color: white;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      margin-bottom: 16px;
      text-decoration: none;
    }
    
    .btn-github:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(36, 41, 46, 0.4);
    }
    
    .btn-biometric {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 24px;
      border-radius: 12px;
      background: linear-gradient(135deg, #00ff88, #00a8ff);
      color: #0a0a0f;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      margin-bottom: 24px;
    }
    
    .btn-biometric:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
    }
    
    .btn-biometric:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .btn-primary {
      width: 100%;
      padding: 14px 24px;
      border-radius: 12px;
      background: linear-gradient(135deg, #00f5ff, #00a8ff);
      color: #0a0a0f;
      font-weight: 700;
      font-size: 16px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 245, 255, 0.3);
    }
    
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .auth-switch {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: #8888aa;
    }
    
    .auth-switch a {
      color: #00f5ff;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }
    
    .auth-switch a:hover {
      color: #00a8ff;
    }
    
    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 10px;
    }
    
    .auth-tab {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #8888aa;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
    }
    
    .auth-tab.active {
      background: rgba(0, 245, 255, 0.1);
      color: #00f5ff;
    }
    
    .auth-tab:hover:not(.active) {
      color: #aaaacc;
    }
    
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .modal-backdrop.visible {
      display: flex;
    }
    
    .modal-content {
      width: 90%;
      max-width: 400px;
      padding: 32px;
      border-radius: 16px;
      background: rgba(20, 20, 35, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }
    
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: #8888aa;
      font-size: 24px;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: all 0.3s ease;
    }
    
    .modal-close:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
    
    .modal-content h3 {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }
    
    .modal-content > p {
      font-size: 14px;
      color: #8888aa;
      margin-bottom: 24px;
    }
    
    .error-message,
    .success-message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    
    .error-message {
      background: rgba(255, 68, 68, 0.1);
      border: 1px solid rgba(255, 68, 68, 0.3);
      color: #ff4444;
    }
    
    .success-message {
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid rgba(0, 255, 136, 0.3);
      color: #00ff88;
    }
    
    @media (max-width: 480px) {
      .auth-card {
        padding: 24px 20px;
      }
      
      .auth-header h2 {
        font-size: 24px;
      }
      
      .auth-header .logo-icon {
        font-size: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card glass">
      <div class="auth-header">
        <div class="logo-icon large">◈</div>
        <h2>Welcome Back</h2>
        <p>Sign in to your LexorA dashboard</p>
      </div>
      
      <div class="error-message" id="error-message"></div>
      <div class="success-message" id="success-message"></div>
      
      <!-- Google OAuth - Primary Login -->
      <a href="#" id="google-login-btn" class="btn-google">
        <svg width="20" height="20" viewBox="0 0 18 18">
          <path d="M17.64 9.2c0-.637-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.715H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.159 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </a>
      
      <a href="#" id="github-login-btn" class="btn-github">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
        </svg>
        Sign in with GitHub
      </a>
      
      <!-- Biometric Login Option -->
      <div class="biometric-login-section" id="biometric-section" style="display: none;">
        <div class="auth-divider">
          <span>or</span>
        </div>
        <button type="button" class="btn-biometric" id="biometric-login-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 17.929H6c-1.105 0-2-.912-2-2.036V5.036C4 3.91 4.895 3 6 3h8c1.105 0 2 .912 2 2.036v1.866m-6 .17h8c1.105 0 2 .91 2 2.035v10.857C20 21.09 19.105 22 18 22h-8c-1.105 0-2-.911-2-2.036V9.107c0-1.124.895-2.036 2-2.036z"/>
          </svg>
          Sign in with Biometrics
        </button>
      </div>
      
      <div class="auth-divider">
        <span>or continue with email</span>
      </div>
      
      <!-- Tab Navigation -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="email">Email</button>
        <button class="auth-tab" data-tab="phone">Phone</button>
      </div>
      
      <!-- Email Login Form -->
      <form id="email-login-form" class="auth-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@email.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" required placeholder="••••••••">
            <button type="button" class="password-toggle" id="toggle-password">👁️</button>
          </div>
        </div>
        <div class="form-group checkbox-group">
          <label>
            <input type="checkbox" name="remember" id="remember-me"> Remember me for 30 days
          </label>
          <a href="#" id="forgot-password-link">Forgot password?</a>
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">Login</button>
      </form>
      
      <!-- Phone Login Form -->
      <form id="phone-login-form" class="auth-form" style="display: none;">
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" required placeholder="+1234567890">
        </div>
        <button type="button" id="send-otp-btn" class="btn btn-outline btn-block">Send OTP</button>
        <div id="otp-section" style="display: none;">
          <div class="form-group">
            <label for="otp">Enter OTP</label>
            <input type="text" id="otp" name="otp" required placeholder="123456" maxlength="6">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Verify & Login</button>
        </div>
      </form>
      
      <p class="auth-switch">
        New user? <a href="register.html">Create account</a>
      </p>
      
      <p class="auth-switch">
        <a href="index.html">← Back to Home</a>
      </p>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal-backdrop" id="forgot-password-modal" aria-hidden="true">
    <div class="modal-content glass">
      <button type="button" class="modal-close" id="close-forgot-modal">×</button>
      <h3>Reset Password</h3>
      <p>Enter your email to receive a password reset link</p>
      <form id="forgot-password-form">
        <div class="form-group">
          <label for="reset-email">Email</label>
          <input type="email" id="reset-email" name="email" required placeholder="you@email.com">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
      </form>
    </div>
  </div>

  <script src="static/$1"></script>
  
  <script>
    // Use centralized configuration
    window.API_BASE_URL = window.LEXORA_CONFIG ? window.LEXORA_CONFIG.API_BASE_URL : '';
    
    // Google OAuth login
    document.getElementById('google-login-btn').addEventListener('click', (e) => {
      e.preventDefault();
      window.location.href = '/auth/google';
    });
    
    // GitHub OAuth login
    document.getElementById('github-login-btn').addEventListener('click', (e) => {
      e.preventDefault();
      window.location.href = '/auth/github';
    });
    
    // Password toggle
    document.getElementById('toggle-password').addEventListener('click', () => {
      const passwordInput = document.getElementById('password');
      passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
      document.getElementById('toggle-password').textContent = passwordInput.type === 'password' ? '👁️' : '🙈';
    });
    
    // Check if WebAuthn is supported
    if (window.PublicKeyCredential && window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) {
      window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()
        .then((available) => {
          if (available) {
            document.getElementById('biometric-section').style.display = 'block';
          }
        })
        .catch((error) => {
          console.log('WebAuthn not available:', error);
        });
    }
    
    // Biometric login
    document.getElementById('biometric-login-btn').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      if (!email) {
        errorEl.textContent = 'Please enter your email first';
        errorEl.style.display = 'block';
        return;
      }
      
      const biometricBtn = document.getElementById('biometric-login-btn');
      biometricBtn.disabled = true;
      biometricBtn.textContent = 'Authenticating...';
      
      try {
        // Begin WebAuthn authentication
        const response = await fetch(`${window.API_BASE_URL}/auth/webauthn/login/begin`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
          credentials: 'include'
        });
        
        const data = await response.json();
        
        if (!data.success) {
          throw new Error(data.error);
        }
        
        // Convert base64url to ArrayBuffer
        const authOptions = data.auth_options;
        authOptions.challenge = base64urlToArrayBuffer(authOptions.challenge);
        authOptions.allowCredentials = authOptions.allowCredentials.map(cred => ({
          ...cred,
          id: base64urlToArrayBuffer(cred.id)
        }));
        
        // Call WebAuthn API
        const credential = await navigator.credentials.get({
          publicKey: authOptions
        });
        
        // Prepare credential data for server
        const credentialData = {
          credentialId: arrayBufferToBase64url(credential.rawId),
          authenticatorData: arrayBufferToBase64url(credential.response.authenticatorData),
          clientDataJSON: arrayBufferToBase64url(credential.response.clientDataJSON),
          signature: arrayBufferToBase64url(credential.response.signature)
        };
        
        // Complete authentication
        const completeResponse = await fetch(`${window.API_BASE_URL}/auth/webauthn/login/complete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(credentialData),
          credentials: 'include'
        });
        
        const completeData = await completeResponse.json();
        
        if (completeData.success) {
          successEl.textContent = 'Biometric authentication successful! Redirecting...';
          successEl.style.display = 'block';
          setTimeout(() => {
            window.location.href = completeData.redirect || '/';
          }, 1000);
        } else {
          throw new Error(completeData.error);
        }
        
      } catch (error) {
        console.error('Biometric login error:', error);
        errorEl.textContent = error.message || 'Biometric authentication failed';
        errorEl.style.display = 'block';
        biometricBtn.disabled = false;
        biometricBtn.textContent = 'Sign in with Biometrics';
      }
    });
    
    // Helper functions for WebAuthn
    function base64urlToArrayBuffer(base64url) {
      const base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
      const padding = '='.repeat((4 - base64.length % 4) % 4);
      const binary = atob(base64 + padding);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes.buffer;
    }
    
    function arrayBufferToBase64url(buffer) {
      const bytes = new Uint8Array(buffer);
      let binary = '';
      bytes.forEach(byte => binary += String.fromCharCode(byte));
      const base64 = btoa(binary);
      return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    }
    
    const errorEl = document.getElementById('error-message');
    const successEl = document.getElementById('success-message');
    
    // Tab switching
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        const tabName = tab.dataset.tab;
        document.getElementById('email-login-form').style.display = tabName === 'email' ? 'block' : 'none';
        document.getElementById('phone-login-form').style.display = tabName === 'phone' ? 'block' : 'none';
      });
    });

    // Forgot password modal
    document.getElementById('forgot-password-link').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('forgot-password-modal').classList.add('visible');
    });

    document.getElementById('close-forgot-modal').addEventListener('click', () => {
      document.getElementById('forgot-password-modal').classList.remove('visible');
    });

    document.getElementById('forgot-password-modal').addEventListener('click', (e) => {
      if (e.target.id === 'forgot-password-modal') {
        e.target.classList.remove('visible');
      }
    });

    // Google OAuth login
    document.getElementById('google-login-btn').addEventListener('click', (e) => {
      e.preventDefault();
      window.location.href = '/auth/google';
    });

    // Email login
    document.getElementById('email-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      
      const errorEl = document.getElementById('error-message');
      const successEl = document.getElementById('success-message');
      const submitBtn = document.getElementById('submit-btn');
      
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';
      
      try {
        const response = await fetch(`${window.API_BASE_URL}/auth/login`, {
          method: 'POST',
          body: formData,
          credentials: 'include'
        });
        const data = await response.json();
        
        if (data.success) {
          successEl.textContent = 'Login successful! Redirecting...';
          successEl.style.display = 'block';
          
          setTimeout(() => {
            window.location.href = data.redirect || '/';
          }, 1000);
        } else {
          errorEl.textContent = data.error || 'Login failed';
          errorEl.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Login';
        }
      } catch (error) {
        console.error('Login error:', error);
        errorEl.textContent = 'Login failed. Please try again.';
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
      }
    });

    // Send OTP
    document.getElementById('send-otp-btn').addEventListener('click', async () => {
      const phone = document.getElementById('phone').value;
      if (!phone) return alert('Please enter phone number');
      
      try {
        const formData = new FormData();
        formData.append('phone', phone);
        
        const response = await fetch(`${window.API_BASE_URL}/auth/send-otp`, {
          method: 'POST',
          body: formData,
          credentials: 'include',
          mode: 'cors'
        });
        const data = await response.json();
        
        if (data.success) {
          document.getElementById('otp-section').style.display = 'block';
          document.getElementById('send-otp-btn').style.display = 'none';
        } else {
          alert(data.error);
        }
      } catch (error) {
        console.error('OTP error:', error);
        alert('Failed to send OTP. Please try again.');
      }
    });

    // Forgot password
    document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      
      try {
        const response = await fetch(`${window.API_BASE_URL}/auth/forgot-password`, {
          method: 'POST',
          body: formData,
          credentials: 'include',
          mode: 'cors'
        });
        const data = await response.json();
        
        if (data.success) {
          alert(data.message);
          document.getElementById('forgot-password-modal').classList.remove('visible');
        } else {
          alert(data.error);
        }
      } catch (error) {
        console.error('Password reset error:', error);
        alert('Failed to send reset link. Please try again.');
      }
    });
  </script>
</body>
</html>
