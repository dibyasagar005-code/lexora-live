<!DOCTYPE html>
<html>
<head>

<title>LexorA</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial;
background:linear-gradient(135deg,#050816,#0b1220,#111827);
color:white;
text-align:center;
}

.header{
padding-top:40px;
}

.logo{
width:300px;
filter:drop-shadow(0px 0px 20px cyan);
}

.title{
font-size:55px;
font-weight:bold;
margin-top:10px;
background:linear-gradient(to right,gold,silver,cyan);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
font-size:20px;
color:#cbd5e1;
margin-bottom:40px;
}

.market-container{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:30px;
padding-bottom:40px;
}

.box{
background:rgba(30,41,59,0.9);
width:320px;
padding:30px;
border-radius:25px;
box-shadow:0px 0px 25px rgba(0,255,255,0.3);
}

.box h2{
font-size:30px;
margin-bottom:15px;
}

.price{
font-size:35px;
font-weight:bold;
color:#00ffff;
}

.footer{
margin-top:40px;
padding:20px;
background:#020617;
font-size:16px;
color:#94a3b8;
}

</style>

</head>

<body>

<div class="header">

<img src="logo.png" class="logo">

<div class="title">LexorA</div>

<div class="subtitle">
Future Smart Browser with Live Market System
</div>

</div>

<div class="market-container">

<div class="box">
<h2>💰 Gold Price</h2>
<div class="price">₹ 6200 / gram</div>
</div>

<div class="box">
<h2>🪙 Silver Price</h2>
<div class="price">₹ 85 / gram</div>
</div>

</div>

<div class="footer">
© 2026 LexorA Browser | Designed by Dibya Sagar Sahoo
</div>

</body>
</html>
