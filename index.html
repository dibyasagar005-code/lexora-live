
      <!-- HISTORY -->
      <section class="view" id="view-history">
        <h2 class="view-title">Session Price History</h2>
        <p class="view-desc">Prices recorded each time live data refreshes</p>
        <canvas id="chartHistory" height="260"></canvas>
        <div class="history-log" id="historyLog"></div>
      </section>
      <!-- SETTINGS -->
      <section class="view" id="view-settings">
        <h2 class="view-title">Settings</h2>
        <div class="settings-box">
          <label>Auto-refresh interval (seconds)</label>
          <input type="number" id="refreshInterval" value="60" min="15" max="300">
          <label>
            <input type="checkbox" id="soundAlert" checked> Show price change highlight
          </label>
          <button class="btn-primary" id="saveSettings">Save Settings</button>
          <p class="settings-note">Data source: metals.live (USD spot) + Frankfurter (USD/INR). Requires internet.</p>
        </div>
      </section>
    </main>
  </div>
  <!-- Status bar -->
  <div class="statusbar">
    <span id="statusLeft">Ready</span>
    <span id="statusRight">Last update: —</span>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
