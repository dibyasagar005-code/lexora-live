theme: jekyll-theme-minimal
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true
include:
  - index.html
  - static/
  - static/**
exclude:
  - README.md
  - requirements.txt
  - render.yaml
  - app.py
  - api/
  - ai/
  - auth/
  - data/
  - models/
  - templates/
  - .github/
